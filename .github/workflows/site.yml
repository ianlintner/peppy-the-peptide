name: Course check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validator unit tests
        run: python -m unittest discover -s tests -v
      - name: Engine unit tests
        run: node --test "site/games/**/__tests__/*.test.js"
      - name: Build and validate course
        run: |
          python scripts/build.py
          python scripts/check.py
          git diff --exit-code -- site/
