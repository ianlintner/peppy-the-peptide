/><text class="peppy-letter" x="94" y="162" font-size="19" text-anchor="middle" dominant-baseline="central"></text></g><g class="peppy-sphere" data-sphere="5" style="--peppy-letter:#000000"><circle cx="146" cy="162" r="22"/><text class="peppy-letter" x="146" y="162" font-size="19" text-anchor="middle" dominant-baseline="central"></text></g><g class="peppy-sphere" data-sphere="6" style="--peppy-letter:#000000"><circle cx="94" cy="208" r="22"/><text class="peppy-letter" x="94" y="208" font-size="19" text-anchor="middle" dominant-baseline="central"></text></g><g class="peppy-sphere" data-sphere="7" style="--peppy-letter:#000000"><circle cx="146" cy="208" r="22"/><text class="peppy-letter" x="146" y="208" font-size="19" text-anchor="middle" dominant-baseline="central"></text></g></g><g class="peppy-face"><g class="peppy-eye peppy-eye--open"><circle class="peppy-fill-ink" cx="108" cy="52" r="5.5"/></g><g class="peppy-eye peppy-eye--wink"><path class="peppy-ink-line" d="M126 54 q8 -10 16 0"/></g><g class="peppy-mouth peppy-mouth--smile"><path class="peppy-ink-line" d="M104 72 q16 12 32 0"/></g><g class="peppy-mouth peppy-mouth--flat"><path class="peppy-ink-line" d="M108 76 h24"/></g><g class="peppy-mouth peppy-mouth--open"><ellipse class="peppy-fill-ink" cx="120" cy="78" rx="9" ry="10"/></g></g><g class="peppy-poses"><g class="peppy-pose" data-state="idle" role="group" aria-label="Peppy, standing at rest with a small smile"><title>Peppy, standing at rest with a small smile</title></g><g class="peppy-pose" data-state="wink" role="group" aria-label="Peppy, winking one eye"><title>Peppy, winking one eye</title><circle class="peppy-fill-gold" cx="150" cy="34" r="3.5"/><circle class="peppy-fill-gold" cx="161" cy="24" r="2.5"/></g><g class="peppy-pose" data-state="thinking" role="group" aria-label="Peppy, thinking, with three thought dots beside the head"><title>Peppy, thinking, with three thought dots beside the head</title><circle class="peppy-fill-paper" cx="176" cy="36" r="7"/><circle class="peppy-fill-paper" cx="196" cy="24" r="5"/><circle class="peppy-fill-paper" cx="211" cy="15" r="3.5"/></g><g class="peppy-pose" data-state="oops" role="group" aria-label="Peppy, surprised, with a sweat drop and a cross above the head"><title>Peppy, surprised, with a sweat drop and a cross above the head</title><path class="peppy-fill-paper" d="M46 32 q10 13 0 20 q-10 -7 0 -20 z"/><path class="peppy-ink-line" d="M28 22 l10 10 M28 32 l10 -10"/></g><g class="peppy-pose" data-state="cheer" role="group" aria-label="Peppy, cheering with both arms raised and sparkles around the head"><title>Peppy, cheering with both arms raised and sparkles around the head</title><path class="peppy-fill-paper" d="M84 140 Q58 118 42 92 L62 80 Q80 106 102 132 Z"/><path class="peppy-fill-paper" d="M156 140 Q182 118 198 92 L178 80 Q160 106 138 132 Z"/><circle class="peppy-glove" cx="38" cy="80" r="14"/><circle class="peppy-glove" cx="202" cy="80" r="14"/><circle class="peppy-fill-gold" cx="112" cy="20" r="4"/><circle class="peppy-fill-gold" cx="128" cy="14" r="3"/><circle class="peppy-fill-gold" cx="144" cy="20" r="4"/><circle class="peppy-fill-gold" cx="24" cy="52" r="3"/><circle class="peppy-fill-gold" cx="216" cy="52" r="3"/></g><g class="peppy-pose" data-state="point" role="group" aria-label="Peppy, pointing to the right with one arm"><title>Peppy, pointing to the right with one arm</title><path class="peppy-fill-paper" d="M158 142 Q190 150 216 148 L216 162 Q188 166 154 158 Z"/><circle class="peppy-glove" cx="222" cy="155" r="9"/></g></g></g></svg>